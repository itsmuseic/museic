<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>MUSEIC | Owner Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #080808;
      color: #f5f1ea;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 34px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      background: #111;
      text-align: center;
    }
    .brand {
      margin-bottom: 28px;
      font-size: .75rem;
      letter-spacing: .42em;
      opacity: .68;
    }
    h1 {
      margin: 0 0 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      font-weight: 400;
    }
    p { margin: 0; color: #b8b1a8; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 22px;
      border-radius: 12px;
      background: #e7ded1;
      color: #111;
      text-decoration: none;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .1em;
    }
  </style>
  <script>
    localStorage.setItem("museicOwnerMode", "enabled");
  </script>
</head>
<body>
  <main>
    <div class="brand">MUSEIC</div>
    <h1>Owner Mode Enabled</h1>
    <p>This browser will no longer be included in MUSEIC website analytics.</p>
    <a href="/">RETURN TO SITE</a>
  </main>
</body>
</html>
